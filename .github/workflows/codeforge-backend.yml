name: CodeForge Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/codeforge-backend.yml"
  push:
    paths:
      - "backend/**"
      - ".github/workflows/codeforge-backend.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://codeforge:codeforge@localhost:5432/codeforge_test
      TEST_REDIS_URL: redis://localhost:6379/15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codeforge_test
          POSTGRES_USER: codeforge
          POSTGRES_PASSWORD: codeforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeforge -d codeforge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend requirements
        run: python -m pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        run: python -m pytest -q
        working-directory: backend
