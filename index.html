<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3d542d" />
    <meta
      name="description"
      content="Solve Codeforces problems and grow your CodeForge village."
    />
    <title>CodeForge — Your village awaits</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Home-screen install: full screen on Android, without Safari's bars on iOS. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CodeForge" />
    <!-- Critical CSS for the loading screen, inlined so it paints before the main stylesheet
         (loaded via src/main.ts) arrives. Without it the unstyled #loading markup shows as a
         white flash on every load. Keep in sync with the #loading rules in src/style.css. -->
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #45623d;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: #fff8e8;
        font-family: 'Nunito Sans', sans-serif;
        background: radial-gradient(ellipse at center, #638b48, #213c30 85%);
        transition: opacity 0.5s;
      }
      #loading.loaded {
        opacity: 0;
        pointer-events: none;
      }
      .loading-emblem {
        font-size: 95px;
        color: #ffce5a;
        text-shadow: 0 5px #785b2c;
      }
      #loading h1 {
        margin: 0;
        font-family: 'Lilita One', 'Trebuchet MS', sans-serif;
        font-weight: 400;
        font-size: 48px;
        letter-spacing: 2px;
        text-shadow: 0 4px #26391f;
      }
      #loading p {
        margin: 14px 0 40px;
        color: #e4eacb;
      }
      .load-track {
        width: 270px;
        height: 13px;
        background: #1f3826;
        border: 2px solid #a2ab6b;
        border-radius: 9px;
        padding: 2px;
      }
      .load-track > div {
        height: 100%;
        background: linear-gradient(#b5ed69, #72ae39);
        border-radius: 4px;
        width: 5%;
        transition: width 0.3s;
      }
      #loading small {
        margin-top: 14px;
        max-width: min(420px, calc(100% - 48px));
        text-align: center;
        color: #c1d1b4;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="game" aria-label="Interactive isometric village"></div>
    <div id="ui"></div>
    <div id="loading">
      <div class="loading-emblem">♜</div>
      <h1>CODEFORGE</h1>
      <p>A little village. A great adventure.</p>
      <div class="load-track"><div id="load-progress"></div></div>
      <small id="load-label">Preparing your village…</small>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
